<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Cleaner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>CSV Cleaner</h1>
        <p>Analyze your CSV file</p>
        <p>Upload a CSV file to analyze your dataset.</p>
        <input type="file" id="csvfile" accept=".csv">
        <button id="analyzebtn">Analyze CSV</button>
        <button id="cleanBtn">Clean CSV</button>
    </div>

    <p id="status"></p>

    <div class="card" id="results">
        <div>
            <h3>File Name</h3>
            <p id="filename">-</p>
        </div>
        <div>
            <h3>Rows</h3>
            <p id="rows">-</p>
        </div>
        <div>
            <h3>Columns</h3>
            <p id="columns">-</p>
        </div>
        <div>
            <h3>Missing Values</h3>
            <p id="missing">-</p>
        </div>
        <div>
            <h3>Duplicate Rows</h3>
            <p id="duplicates">-</p>
        </div>
    </div>

    <div class="result" id="cleanSummary">

        <div >
            <h3>Original Rows</h3>
            <p id="originalRows">-</p>
        </div>

        <div >
            <h3>Cleaned Rows</h3>
            <p id="cleanedRows">-</p>
        </div>

        <div >
            <h3>Duplicates Removed</h3>
            <p id="duplicatesRemoved">-</p>
        </div>

        <div>
            <h3>Missing values</h3>
            <p id="missingChanged">-</p>
        </div>

    </div>

    <a id="downloadBtn"  href="#">Download Cleaned CSV</a>
    
    <script src="script.js"></script>
</body>

</html>
